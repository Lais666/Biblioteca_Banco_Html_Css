<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header>
    <h1>🔐 Login</h1>
    <nav>
      <a href="{{ url_for('index') }}" class="btn">🏠 Início</a>
    </nav>
  </header>

  <main>
    <h2>Entrar no Sistema</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="post">
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>

      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        <button type="submit" class="btn">🔓 Entrar</button>
<a href="{{ url_for('index') }}" class="btn" style="background-color: #f87171;">❌ Cancelar</a>
      </div>
    </form>

    <p style="margin-top: 20px; text-align: center;">
      Ainda não tem uma conta? <a href="{{ url_for('cadastro_usuario') }}" style="color: var(--accent); font-weight: 600;">Cadastre-se aqui</a>.
    </p>
  </main>
</body>
</html>
