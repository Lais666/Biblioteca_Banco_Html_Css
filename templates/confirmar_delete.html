<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Confirmar Exclusão</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header>
    <h1>⚠️ Confirmar Exclusão</h1>
    <nav>
      <a href="{{ url_for('index') }}" class="btn">🏠 Início</a>
    </nav>
  </header>

  <main>
    <h2>Tem certeza que deseja excluir o livro <strong>{{ livro[1] }}</strong>?</h2>

    <form method="post" action="{{ url_for('deletar', id=livro[0]) }}">
      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px;">
        <button type="submit" class="btn danger">❌ Sim, Excluir</button>
        <a href="{{ url_for('index') }}" class="btn">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
