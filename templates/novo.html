<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Adicionar Livro</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<script>
  function mostrarImagem(event) {

    const arquivo = event.target.files[0];

    if (arquivo) {

      const imagem = document.getElementById('preview');
      const container = document.getElementById('preview-container');

      imagem.src = URL.createObjectURL(arquivo);

      container.style.display = 'block';

    }
  }
</script>
<body>
  <header>
    <h1>📕 Adicionar Livro</h1>
    <nav>
      <a href="{{ url_for('index') }}" class="btn">🏠 Início</a>
    </nav>
  </header>

  <main>
    <h2>Adicionar Livro</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('criar') }}" method="post" enctype="multipart/form-data">
      <label for="titulo">Título:</label>
      <input type="text" id="titulo" name="titulo" required>

      <label for="autor">Autor:</label>
      <input type="text" id="autor" name="autor" required>

      <label for="ano_publicacao">Ano de Publicação:</label>
      <input type="number" id="ano_publicacao" name="ano_publicacao" required>

<label for="arquivo">Capa do Livro:</label>

<input
  type="file"
  id="arquivo"
  name="arquivo"
  accept=".jpg,.jpeg,.png"
  onchange="mostrarImagem(event)"
>

<div id="preview-container" style="margin-top: 15px; display: none;">
  <p>Prévia da capa:</p>

  <img
    id="preview"
    src=""
    alt="Prévia da capa"
    style="
      width: 150px;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ccc;
    "
  >
</div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        <button type="submit" class="btn">💾 Salvar</button>
<a href="{{ url_for('index') }}" class="btn" style="background-color: #f87171;">❌ Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
