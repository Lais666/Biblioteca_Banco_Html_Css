<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar Usuário</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header>
    <h1>📝 Editar Usuário</h1>
    <nav>
      <a href="{{ url_for('index') }}" class="btn">🏠 Início</a>
    </nav>
  </header>

  <main>
    <h2>Editar Dados</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('editar_usuario', id=id) }}" method="post">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" value="{{ usuario[0] }}" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" value="{{ usuario[1] }}" required>

      <label for="senha">Nova Senha (opcional):</label>
      <input type="password" id="senha" name="senha">

      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        <button type="submit" class="btn">💾 Atualizar</button>
        <a href="{{ url_for('index') }}" class="btn">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
